# The native (GPUI Kit) frontend. A workspace of its own, kept apart from
# src-tauri so the Tauri build, its target dir and build.rs are untouched.
# See docs/gpui-migration-plan.md.
[workspace]
resolver = "2"
members = ["app", "terminal"]

[workspace.package]
edition = "2021"
# The native preview's own version line, apart from the Tauri app's
# (src-tauri/Cargo.toml). Released by tagging native-v<this>; see RELEASING.md.
version = "0.6.0-preview.1"
license = "MIT"

[workspace.dependencies]
gpui-kit = "0.8.0"
