[package]
name = "termdrop-gpui"
version.workspace = true
# 2024 for let-chains, which GPUI Kit itself is written in.
edition = "2024"

[[bin]]
name = "termdrop-native"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
termdrop-terminal = { path = "../terminal" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
