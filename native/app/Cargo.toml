[package]
name = "termdrop-gpui"
version.workspace = true
# 2024 for let-chains, which GPUI Kit itself is written in.
edition = "2024"

[[bin]]
name = "termdrop-native"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
termdrop-terminal = { path = "../terminal" }
# The backend the Tauri app also runs on. A member of the src-tauri workspace
# there; cargo ignores that when it is a path dependency from this one.
termdrop-core = { path = "../../crates/termdrop-core" }
# The core's async calls need a runtime the app owns (see core_backend.rs).
tokio = { version = "1", features = ["rt-multi-thread"] }
# Carries core events from backend threads to the UI thread.
async-channel = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native file dialogs (export/import, key file). GTK on Linux, as the Tauri
# dialog plugin uses, rather than the XDG portal, which WSLg lacks.
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
# Local time for the panels' dates (panels/common.rs). Already in the lock
# through GPUI Kit.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Docker exec PTY ids (PanelContext::new_pty_session_id). In the lock through
# termdrop-core.
uuid = { version = "1", features = ["v4"] }
# Decoding SFTP image previews (sftp_read_file_base64). In the lock through termdrop-core.
base64 = "0.22"
# Display columns of a Redis string value cut into rows (datastores/redis).
# In the lock through GPUI Kit.
unicode-width = "0.2"
# Decoding the Tight JPEG rectangles a VNC session passes through, and the
# frames GPUI's RenderImage is built from (datastores/vnc). In the lock
# through GPUI, with the same features.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# One running copy per user (single_instance.rs), as the Tauri app gets from
# tauri-plugin-single-instance: a named mutex on Windows, an abstract socket
# on Linux, flock on macOS.
single-instance = "0.3"
