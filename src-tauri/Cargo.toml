[package]
name = "termdrop"
version = "0.5.1"
description = "A lightweight SSH client and SFTP browser"
authors = ["sevheng"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The backend lives in crates/termdrop-core, with no Tauri dependency, so the
# native app can share it. Listing it here (and in default-members) is what
# makes `cargo test`, clippy and fmt from this directory cover it as well.
[workspace]
members = [".", "../crates/termdrop-core"]
default-members = [".", "../crates/termdrop-core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Everything below the commands: SSH, SFTP, VNC, the datastores, storage. Its
# own Cargo.toml carries the dependencies (and the version pins) those need.
termdrop-core = { path = "../crates/termdrop-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde_json = "1"
r2d2 = "0.8"
r2d2_sqlite = "0.35"
dirs = "7"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
