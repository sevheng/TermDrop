<!doctype html>
<!-- The 1280x640 social preview. run.mjs serves this folder with the fonts,
     the icon and a fresh terminal screenshot copied beside it. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Plex; font-weight: 400; src: url(ibm-plex-sans-latin-400-normal.woff2) }
  @font-face { font-family: Plex; font-weight: 600; src: url(ibm-plex-sans-latin-600-normal.woff2) }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #0b0e14; font-family: Plex }
  .glow { position: absolute; inset: 0; background: radial-gradient(900px 500px at 15% 20%, rgba(59, 158, 255, .18), transparent 60%) }
  .text { position: absolute; left: 72px; top: 150px; width: 470px; color: #e7eaf0 }
  .text img { width: 96px; height: 96px }
  h1 { font-weight: 600; font-size: 64px; margin: 20px 0 8px; letter-spacing: -1px }
  p { font-size: 25px; line-height: 1.4; color: #9aa4b2; margin: 0 }
  .platforms { margin-top: 26px; font-size: 17px; color: #3B9EFF; letter-spacing: .3px }
  .shot { position: absolute; left: 600px; top: 84px; width: 760px; border-radius: 12px; border: 1px solid #273042; box-shadow: 0 30px 80px rgba(0, 0, 0, .6) }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="text">
    <img src="icon.png" alt="">
    <h1>TermDrop</h1>
    <p>SSH, SFTP, Docker, MongoDB, Redis and remote desktops in one fast native app.</p>
    <div class="platforms">Windows · macOS · Linux · Open source</div>
  </div>
  <img class="shot" src="shot.png" alt="">
</body>
</html>
