name: Feature request
description: Suggest something TermDrop should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [existing issues](https://github.com/sevheng/TermDrop/issues?q=is%3Aissue)
        first; a 👍 on an existing request helps prioritise it.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How you imagine it working. Sketches or screenshots welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Other tools or workarounds, and why they fall short.
