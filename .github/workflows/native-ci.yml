name: Native CI

# Builds and tests the GPUI Kit app (native/) on the three desktop platforms.
# GPUI renders with Metal on macOS, DirectX on Windows and Vulkan on Linux, so a
# Linux-only check says nothing about the other two.
on:
  push:
    branches: ['gpui-kit', 'native/**']
    paths:
      - 'native/**'
      - 'crates/**'
      - '.github/workflows/native-*.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'crates/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libgtk-3-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev libzstd-dev

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Compiler errors are echoed as one annotation so they can be read
      # from the run summary without downloading the logs.
      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee ../clippy.log || {
            msg=$( { grep -E 'error|warning' ../clippy.log || true; echo '--- last lines ---'; tail -n 40 ../clippy.log; } | tail -n 120 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' || true)
            echo "::error title=clippy (${{ matrix.platform }})::${msg}"
            exit 1
          }

      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee ../test.log || {
            msg=$( { grep -E '^error|panicked|FAILED|^---- ' ../test.log || true; echo '--- last lines ---'; tail -n 40 ../test.log; } | tail -n 120 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' || true)
            echo "::error title=tests (${{ matrix.platform }})::${msg}"
            exit 1
          }
